quarkus.http.host=0.0.0.0
quarkus.otel.service.name=impairment-analysis-adapter
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.log.category."org.apache.camel".level=WARN
impairment.url=${IMPAIRMENT_UPSTREAM_URL:}
impairment.token=${IMPAIRMENT_UPSTREAM_TOKEN:}
impairment.version=${IMPAIRMENT_PIPELINE_VERSION:unverified}
impairment.classifier=${IMPAIRMENT_CLASSIFIER_MODEL:}
impairment.mock=${IMPAIRMENT_MOCK:false}
impairment.timeout-ms=${IMPAIRMENT_TIMEOUT_MS:600000}
