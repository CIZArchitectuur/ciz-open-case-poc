quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=64K
quarkus.otel.service.name=policy-service
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.otel.exporter.otlp.protocol=grpc
regelrecht.executable=${REGELRECHT_EXECUTABLE:/usr/local/bin/regelrecht-evaluate}
regelrecht.timeout-seconds=${REGELRECHT_TIMEOUT_SECONDS:10}
