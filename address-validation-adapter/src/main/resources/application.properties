quarkus.http.host=0.0.0.0
quarkus.application.name=address-validation-adapter
quarkus.otel.service.name=address-validation-adapter
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.jackson.fail-on-unknown-properties=true
pdok.base-url=${PDOK_BASE_URL:https://api.pdok.nl/bzk/locatieserver/search/v3_1/free}
pdok.connect-timeout-ms=${PDOK_CONNECT_TIMEOUT_MS:2000}
pdok.read-timeout-ms=${PDOK_READ_TIMEOUT_MS:2500}
camel.component.http.connect-timeout=${pdok.connect-timeout-ms}
camel.component.http.connection-request-timeout=${pdok.connect-timeout-ms}
camel.component.http.response-timeout=${pdok.read-timeout-ms}
