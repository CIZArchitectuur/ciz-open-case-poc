quarkus.http.host=0.0.0.0
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:bas}
quarkus.datasource.password=${DB_PASSWORD:bas-local-only}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:bas-db}:5432/${DB_NAME:bas}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.otel.service.name=bas-service
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.rest-client.provider-autodiscovery=false
quarkus.rest-client.document-api.url=${API_GATEWAY_URL:http://kong:8000}/api
quarkus.rest-client.document-api.connect-timeout=3000
quarkus.rest-client.document-api.read-timeout=15000
quarkus.rest-client.document-structuring-api.url=${API_GATEWAY_URL:http://kong:8000}/internal/document-structuring
quarkus.rest-client.document-structuring-api.connect-timeout=3000
quarkus.rest-client.document-structuring-api.read-timeout=18000
quarkus.rest-client.impairment-analysis-api.url=${API_GATEWAY_URL:http://kong:8000}/internal/impairment-analysis
quarkus.rest-client.impairment-analysis-api.connect-timeout=3000
quarkus.rest-client.impairment-analysis-api.read-timeout=${IMPAIRMENT_READ_TIMEOUT_MS:610000}
org.eclipse.microprofile.rest.client.propagateHeaders=traceparent,tracestate,X-Correlation-ID
mp.messaging.incoming.submissions.connector=smallrye-kafka
mp.messaging.incoming.submissions.topic=application.submitted
mp.messaging.incoming.submissions.group.id=bas-submissions
mp.messaging.incoming.submissions.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.submissions.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
mp.messaging.incoming.submissions.auto.offset.reset=earliest
mp.messaging.incoming.submissions.failure-strategy=dead-letter-queue
mp.messaging.incoming.submissions.dead-letter-queue.topic=application.submitted.dlq
mp.messaging.incoming.documents.connector=smallrye-kafka
mp.messaging.incoming.documents.topic=document.received
mp.messaging.incoming.documents.group.id=bas-document-receipts
mp.messaging.incoming.documents.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.documents.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
mp.messaging.incoming.documents.auto.offset.reset=earliest
mp.messaging.incoming.documents.failure-strategy=dead-letter-queue
mp.messaging.incoming.documents.dead-letter-queue.topic=document.received.dlq

# Azure Event Hubs uses the Kafka protocol over TLS; local Compose stays plaintext.
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
kafka.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
