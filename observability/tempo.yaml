server:
  http_listen_port: 3200

stream_over_http_enabled: true

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

live_store:
  max_trace_idle: 10s
  max_block_duration: 5m

backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        block_retention: 48h
        compacted_block_retention: 10m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 48h

usage_report:
  reporting_enabled: false
