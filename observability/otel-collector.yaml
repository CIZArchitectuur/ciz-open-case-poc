receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/privacy:
    actions:
      - key: url.full
        action: delete
      - key: url.path
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: db.connection_string
        action: delete
      - key: db.user
        action: delete
      - key: enduser.id
        action: delete
      - key: user.id
        action: delete
      - key: client.address
        action: delete
      - key: network.peer.address
        action: delete
      - key: network.peer.port
        action: delete
      - key: net.peer.ip
        action: delete
      - key: http.client_ip
        action: delete
      - key: user_agent.original
        action: delete
      - key: server.address
        action: delete
      - key: server.port
        action: delete
      - key: http.host
        action: delete
      - key: process.command_args
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.pid
        action: delete
      - key: host.name
        action: delete
      - key: container.id
        action: delete
      - key: messaging.kafka.message.key
        action: delete
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  batch:
    timeout: 5s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, transform/privacy, batch]
      exporters: [otlp_grpc/tempo]
