name: ciz-open-case-poc

services:
  case-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cases
      POSTGRES_USER: cases
      POSTGRES_PASSWORD: cases-local-only
    volumes:
      - postgres-case-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cases -d cases"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]

  operaton-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operaton
      POSTGRES_USER: operaton
      POSTGRES_PASSWORD: operaton-local-only
    volumes:
      - postgres-operaton-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaton -d operaton"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]

  document-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: documents-local-only
    volumes:
      - postgres-document-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]
  
  karavan-db:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: karavan
      POSTGRES_USER: karavan
      POSTGRES_PASSWORD: karavan_password
    volumes:
      - postgres-karavan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karavan -d karavan"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      - karavan-net

  s3:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ciz-local
      MINIO_ROOT_PASSWORD: ciz-local-secret
    volumes:
      - s3-document-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  s3-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://s3:9000 ciz-local ciz-local-secret &&
        mc mb --ignore-existing local/ciz-documents
    depends_on:
      s3:
        condition: service_healthy
    networks: [case-network]

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
      target: runtime
    environment:
      DB_HOST: document-db
      DB_PORT: "5432"
      DB_NAME: documents
      DB_USER: documents
      DB_PASSWORD: documents-local-only
      S3_ENDPOINT: http://s3:9000
      S3_REGION: eu-west-1
      S3_BUCKET: ciz-documents
      S3_ACCESS_KEY: ciz-local
      S3_SECRET_KEY: ciz-local-secret
      OTEL_SDK_DISABLED: "true"
    depends_on:
      document-db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  policy-service:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
      target: runtime
      args:
        REGELRECHT_REVISION: 89f43786b66ed270b066ae32a48332ce189c73a5
    environment:
      OTEL_SDK_DISABLED: "true"
      REGELRECHT_TIMEOUT_SECONDS: "10"
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  operaton:
    build:
      context: processes
      dockerfile: Dockerfile
    image: operaton/operaton:latest
    command: ["./operaton.sh", "--webapps", "--rest"]
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://operaton-db:5432/operaton
      DB_USERNAME: operaton
      DB_PASSWORD: operaton-local-only
      WAIT_FOR: operaton-db:5432
      WAIT_FOR_TIMEOUT: "60"
      JAVA_OPTS: -XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=2
      TZ: Europe/Amsterdam
    volumes:
      - ./processes:/operaton/configuration/resources:ro
    depends_on:
      operaton-db:
        condition: service_healthy
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/engine-rest/engine >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks: [case-network]

  case-service:
    build:
      context: .
      dockerfile: case-service/Dockerfile
      target: runtime
    environment:
      DB_HOST: case-db
      DB_PORT: "5432"
      DB_NAME: cases
      DB_USER: cases
      DB_PASSWORD: cases-local-only
      OTEL_SDK_DISABLED: "true"
      OPERATON_BASE_URL: http://operaton:8080/engine-rest
      DOCUMENT_SERVICE_URL: http://document-service:8080
      POLICY_SERVICE_URL: http://policy-service:8080
    depends_on:
      case-db:
        condition: service_healthy
      operaton:
        condition: service_healthy
      document-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  frontend:
    build:
      context: frontend
      target: runtime
    depends_on:
      case-service:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]

  case-service-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: case-service/Dockerfile
      target: development
    working_dir: /workspace/case-service
    command: mvn quarkus:dev -Dquarkus.http.host=0.0.0.0
    environment:
      DB_HOST: case-db
      DB_PORT: "5432"
      DB_NAME: cases
      DB_USER: cases
      DB_PASSWORD: cases-local-only
      OTEL_SDK_DISABLED: "true"
      OPERATON_BASE_URL: http://operaton:8080/engine-rest
      DOCUMENT_SERVICE_URL: http://document-service:8080
      POLICY_SERVICE_URL: http://policy-service:8080
    volumes:
      - ./case-service:/workspace/case-service
      - ./contracts:/workspace/contracts:ro
      - maven-cache:/home/quarkus/.m2
    depends_on:
      case-db:
        condition: service_healthy
      operaton:
        condition: service_healthy
      document-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks: [case-network]

  frontend-dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://case-service:8080
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    depends_on:
      case-service:
        condition: service_healthy
    ports:
      - "5173:5173"
    networks: [case-network]

  unit-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: case-service/Dockerfile
      target: test

  document-unit-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: document-service/Dockerfile
      target: test

  contract-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    command: ["pytest", "-q", "tests/contract"]
    environment:
      CASE_SERVICE_URL: http://case-service:8080
      POLICY_SERVICE_URL: http://policy-service:8080
    depends_on:
      case-service:
        condition: service_healthy
    networks: [case-network]

  integration-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    command: ["pytest", "-q", "tests/integration"]
    environment:
      CASE_SERVICE_URL: http://case-service:8080
      OPERATON_URL: http://operaton:8080/engine-rest
      POLICY_SERVICE_URL: http://policy-service:8080
    depends_on:
      case-service:
        condition: service_healthy
    networks: [case-network]

  e2e-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    command: ["pytest", "-q", "tests/e2e"]
    environment:
      FRONTEND_URL: http://frontend:8080
    depends_on:
      frontend:
        condition: service_healthy
    networks: [case-network]

  karavan-registry:
    image: registry:2
    container_name: registry
    ports:
      - "4000:5000"
    networks:
      - karavan-net

  karavan:
    image: ghcr.io/apache/camel-karavan:4.8.0
    container_name: karavan
    ports:
      - "8085:8080"
    environment:
      - KARAVAN_DOCKER_NETWORK=karavan-net
      - KARAVAN_CONTAINER_IMAGE_REGISTRY=karavan-registry:4000
      - KARAVAN_DATASOURCE_URL=jdbc:postgresql://karavan-db:5432/karavan
      - KARAVAN_DATASOURCE_USERNAME=karavan
      - KARAVAN_DATASOURCE_PASSWORD=karavan_password
    volumes:
      # Nodig zodat Karavan zelf containers kan opstarten via jouw Docker engine
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - karavan-db
      - karavan-registry
    networks:
      - karavan-net

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - karavan-net

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8086:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:29092"
    depends_on:
      - kafka
    networks:
      - karavan-net 

volumes:
  postgres-case-data:
  postgres-operaton-data:
  postgres-document-data:
  postgres-karavan-data:
  s3-document-data:
  maven-cache:
  frontend-node-modules:

networks:
  case-network:
  karavan-net:
    name: karavan-net
