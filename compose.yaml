name: ciz-open-case-poc

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8082
      - --hostname-backchannel-dynamic=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./security/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    restart: unless-stopped
    networks: [case-network]

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-traces:/var/tempo
    networks: [case-network]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped
    networks: [case-network]

  grafana:
    image: grafana/grafana:12.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ciz-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped
    networks: [case-network]

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [case-network]

  case-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cases
      POSTGRES_USER: cases
      POSTGRES_PASSWORD: cases-local-only
    volumes:
      - postgres-case-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cases -d cases"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]

  operaton-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operaton
      POSTGRES_USER: operaton
      POSTGRES_PASSWORD: operaton-local-only
    volumes:
      - postgres-operaton-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaton -d operaton"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]

  document-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: documents-local-only
    volumes:
      - postgres-document-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]

  s3:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ciz-local
      MINIO_ROOT_PASSWORD: ciz-local-secret
    volumes:
      - s3-document-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  s3-init:
    image: amazon/aws-cli:2.27.16
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ciz-local
      AWS_SECRET_ACCESS_KEY: ciz-local-secret
      AWS_DEFAULT_REGION: eu-west-1
    command:
      - >-
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket ciz-documents >/dev/null 2>&1 ||
        aws --endpoint-url http://s3:9000 s3 mb s3://ciz-documents
    depends_on:
      s3:
        condition: service_healthy
    networks: [case-network]

  kong:
    image: kong:3.9.3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
      KONG_PROXY_ACCESS_LOG: /dev/stdout ciz_safe
      KONG_NGINX_HTTP_LOG_FORMAT: "ciz_safe '$$request_method $$status $$request_time $$upstream_response_time $$http_x_correlation_id'"
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 10m
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      otel-collector:
        condition: service_started
      document-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      operaton:
        condition: service_healthy
      address-validation-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong-health"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
      target: runtime
    environment:
      DB_HOST: document-db
      DB_PORT: "5432"
      DB_NAME: documents
      DB_USER: documents
      DB_PASSWORD: documents-local-only
      S3_ENDPOINT: http://s3:9000
      S3_REGION: eu-west-1
      S3_BUCKET: ciz-documents
      S3_ACCESS_KEY: ciz-local
      S3_SECRET_KEY: ciz-local-secret
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: document-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      document-db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  policy-service:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
      target: runtime
      args:
        REGELRECHT_REVISION: 89f43786b66ed270b066ae32a48332ce189c73a5
    environment:
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: policy-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      REGELRECHT_TIMEOUT_SECONDS: "10"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  address-validation-adapter:
    build:
      context: .
      dockerfile: address-validation-adapter/Dockerfile
    environment:
      PDOK_BASE_URL: ${PDOK_BASE_URL:-https://api.pdok.nl/bzk/locatieserver/search/v3_1/free}
      PDOK_CONNECT_TIMEOUT_MS: ${PDOK_CONNECT_TIMEOUT_MS:-2000}
      PDOK_READ_TIMEOUT_MS: ${PDOK_READ_TIMEOUT_MS:-2500}
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: address-validation-adapter
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  status-notification-adapter:
    build:
      context: .
      dockerfile: status-notification-adapter/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: application.status.changed
      STATUS_BATCH_INTERVAL_MS: ${STATUS_BATCH_INTERVAL_MS:-60000}
      STATUS_CONSUMER_GROUP: administrative-support-mock
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: status-notification-adapter
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [case-network]

  operaton:
    build:
      context: processes
      dockerfile: Dockerfile
    image: operaton-ciz:local
    command: ["./operaton.sh", "--webapps", "--rest"]
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://operaton-db:5432/operaton
      DB_USERNAME: operaton
      DB_PASSWORD: operaton-local-only
      WAIT_FOR: operaton-db:5432
      WAIT_FOR_TIMEOUT: "60"
      JAVA_OPTS: -XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=2 -javaagent:/otel/opentelemetry-javaagent.jar
      TZ: Europe/Amsterdam
      OTEL_SERVICE_NAME: operaton
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - ./processes:/operaton/configuration/resources:ro
    depends_on:
      operaton-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/engine-rest/engine >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks: [case-network]

  case-service:
    build:
      context: .
      dockerfile: case-service/Dockerfile
      target: runtime
    environment:
      DB_HOST: case-db
      DB_PORT: "5432"
      DB_NAME: cases
      DB_USER: cases
      DB_PASSWORD: cases-local-only
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: case-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/ciz-poc
      OIDC_TOKEN_ISSUER: http://localhost:8082/realms/ciz-poc
      OIDC_ROLE_CLAIM_PATH: ${OIDC_ROLE_CLAIM_PATH:-ciz_roles}
      API_GATEWAY_URL: http://kong:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      case-db:
        condition: service_healthy
      kong:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]

  frontend:
    build:
      context: frontend
      target: runtime
      args:
        VITE_OIDC_AUTHORITY: ${OIDC_FRONTEND_AUTHORITY:-http://localhost:8082/realms/ciz-poc}
        VITE_OIDC_CLIENT_ID: ${OIDC_FRONTEND_CLIENT_ID:-ciz-frontend}
        VITE_OIDC_REDIRECT_URI: ${OIDC_FRONTEND_REDIRECT_URI:-http://localhost:3000/oidc/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_FRONTEND_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000/aanvrager}
        VITE_OIDC_ROLE_CLAIM_PATH: ${OIDC_FRONTEND_ROLE_CLAIM_PATH:-ciz_roles}
    depends_on:
      kong:
        condition: service_healthy
      case-service:
        condition: service_healthy
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [case-network]

  case-service-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: case-service/Dockerfile
      target: development
    working_dir: /workspace/case-service
    command: mvn quarkus:dev -Dquarkus.http.host=0.0.0.0
    environment:
      DB_HOST: case-db
      DB_PORT: "5432"
      DB_NAME: cases
      DB_USER: cases
      DB_PASSWORD: cases-local-only
      OTEL_SDK_DISABLED: "true"
      API_GATEWAY_URL: http://kong:8000
    volumes:
      - ./case-service:/workspace/case-service
      - ./contracts:/workspace/contracts:ro
      - maven-cache:/home/quarkus/.m2
    depends_on:
      case-db:
        condition: service_healthy
      kong:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks: [case-network]

  frontend-dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://kong:8000
      VITE_OIDC_AUTHORITY: ${OIDC_FRONTEND_AUTHORITY:-http://localhost:8082/realms/ciz-poc}
      VITE_OIDC_CLIENT_ID: ${OIDC_FRONTEND_CLIENT_ID:-ciz-frontend}
      VITE_OIDC_REDIRECT_URI: ${OIDC_FRONTEND_REDIRECT_URI:-http://localhost:5173/oidc/callback}
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_FRONTEND_POST_LOGOUT_REDIRECT_URI:-http://localhost:5173/aanvrager}
      VITE_OIDC_ROLE_CLAIM_PATH: ${OIDC_FRONTEND_ROLE_CLAIM_PATH:-ciz_roles}
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "5173:5173"
    networks: [case-network]

  unit-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: case-service/Dockerfile
      target: test

  document-unit-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: document-service/Dockerfile
      target: test

  address-validation-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: address-validation-adapter/Dockerfile
      target: test

  status-notification-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: status-notification-adapter/Dockerfile
      target: test

  contract-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    command: ["pytest", "-q", "tests/contract"]
    environment:
      CASE_SERVICE_URL: http://kong:8000/api
      GATEWAY_URL: http://kong:8000
      POLICY_SERVICE_URL: http://policy-service:8080
      OIDC_TEST_TOKEN_URL: http://keycloak:8080/realms/ciz-poc/protocol/openid-connect/token
    depends_on:
      kong:
        condition: service_healthy
      case-service:
        condition: service_healthy
    networks: [case-network]

  integration-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    command: ["pytest", "-q", "tests/integration"]
    environment:
      CASE_SERVICE_URL: http://kong:8000/api
      GATEWAY_URL: http://kong:8000
      OPERATON_URL: http://operaton:8080/engine-rest
      POLICY_SERVICE_URL: http://policy-service:8080
      OIDC_TEST_TOKEN_URL: http://keycloak:8080/realms/ciz-poc/protocol/openid-connect/token
    depends_on:
      kong:
        condition: service_healthy
      case-service:
        condition: service_healthy
    networks: [case-network]

  e2e-tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/Dockerfile
    command: ["pytest", "-q", "tests/e2e"]
    environment:
      FRONTEND_URL: http://frontend:8080
      OIDC_TEST_TOKEN_URL: http://keycloak:8080/realms/ciz-poc/protocol/openid-connect/token
    depends_on:
      frontend:
        condition: service_healthy
    networks: [case-network]

  ui-tests:
    profiles: [test]
    build:
      context: tests/ui
      dockerfile: Dockerfile
    depends_on:
      frontend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [case-network]

volumes:
  postgres-case-data:
  postgres-operaton-data:
  postgres-document-data:
  s3-document-data:
  maven-cache:
  frontend-node-modules:
  tempo-traces:
  grafana-data:

networks:
  case-network:
