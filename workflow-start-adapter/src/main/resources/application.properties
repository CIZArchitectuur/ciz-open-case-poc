quarkus.http.host=0.0.0.0
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:workflow}
quarkus.datasource.password=${DB_PASSWORD:workflow-local-only}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:workflow-start-db}:5432/${DB_NAME:workflow}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.otel.service.name=workflow-start-adapter
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.rest-client.provider-autodiscovery=false
quarkus.rest-client.operaton-api.url=${API_GATEWAY_URL:http://kong:8000}/api/workflow
quarkus.rest-client.operaton-api.connect-timeout=3000
quarkus.rest-client.operaton-api.read-timeout=10000
quarkus.rest-client.operaton-api.providers=nl.ciz.workflow.CorrelationFilter
mp.messaging.incoming.submissions.connector=smallrye-kafka
mp.messaging.incoming.submissions.topic=application.submitted
mp.messaging.incoming.submissions.group.id=workflow-start-submissions
mp.messaging.incoming.submissions.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.submissions.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
mp.messaging.incoming.submissions.auto.offset.reset=earliest
workflow.max-attempts=${WORKFLOW_MAX_ATTEMPTS:12}

# Azure Event Hubs uses the Kafka protocol over TLS; local Compose stays plaintext.
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
kafka.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
