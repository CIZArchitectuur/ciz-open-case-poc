# Managed Blob compatibility profile: local Azurite replaces the cloud account.
# The application continues using its S3 API; only the stateless gateway translates.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --silent
    healthcheck:
      test: [CMD, node, -e, "require('net').connect(10000,'127.0.0.1').once('connect',()=>process.exit(0)).once('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [case-network]
  s3:
    image: andrewgaul/s3proxy:4.1.1@sha256:87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04
    build: !reset null
    command: !reset null
    ports: !reset []
    volumes: !reset []
    environment:
      LOG_LEVEL: warn
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_ENDPOINT: http://0.0.0.0:9000
      S3PROXY_IDENTITY: ciz-local
      S3PROXY_CREDENTIAL: ciz-local-secret
      JCLOUDS_PROVIDER: azureblob
      JCLOUDS_ENDPOINT: http://azurite:10000/devstoreaccount1
      JCLOUDS_IDENTITY: devstoreaccount1
      # Public Azurite emulator key, never a cloud credential.
      JCLOUDS_CREDENTIAL: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
    depends_on:
      azurite: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 30
