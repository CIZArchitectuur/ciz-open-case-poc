quarkus.http.host=0.0.0.0
quarkus.application.name=status-notification-adapter
quarkus.otel.service.name=status-notification-adapter
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/live
quarkus.smallrye-health.readiness-path=/ready
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
status.input.topic=${KAFKA_INPUT_TOPIC:application.status.changed}
status.consumer.group=${STATUS_CONSUMER_GROUP:administrative-support-mock}
status.batch.interval-ms=${STATUS_BATCH_INTERVAL_MS:60000}
