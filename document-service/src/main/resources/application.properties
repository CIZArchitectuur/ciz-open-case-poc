quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:documents}
quarkus.datasource.password=${DB_PASSWORD:documents-local-only}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:document-db}:${DB_PORT:5432}/${DB_NAME:documents}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
quarkus.http.limits.max-body-size=${MAX_DOCUMENT_SIZE:10M}
quarkus.otel.service.name=document-service
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.otel.exporter.otlp.protocol=grpc
s3.endpoint=${S3_ENDPOINT:http://s3:9000}
s3.region=${S3_REGION:eu-west-1}
s3.bucket=${S3_BUCKET:ciz-documents}
s3.access-key=${S3_ACCESS_KEY:ciz-local}
s3.secret-key=${S3_SECRET_KEY:ciz-local-secret}
