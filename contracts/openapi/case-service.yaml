openapi: 3.0.3
info:
  title: CIZ Open Case API
  version: 0.7.0
  description: Contract-first API for fictional Wlz cases, S3-backed documents, and Operaton workflow tasks.
paths:
  /cases/{caseId}/bas-runs:
    get:
      operationId: listCaseBasRuns
      summary: Processing history and readiness, without extracted medical content
      security: [{oidcBearer: []}]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: BAS processing versions
          content:
            application/json:
              schema: {type: array, items: {$ref: './bas-service.yaml#/components/schemas/BasRun'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /cases/drafts:
    post:
      operationId: createCaseDraft
      summary: Save a fictional application draft before uploading attachments
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCaseRequest'}
      responses:
        '201':
          description: Draft created; no workflow or BAS analysis started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /cases/{caseId}/submit:
    post:
      operationId: submitCase
      summary: Definitively submit a fictional draft and publish its persisted attachments asynchronously
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: X-Correlation-ID
          in: header
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: Submitted application durably recorded; workflow and BAS are started asynchronously through Kafka. Retrying submission is idempotent; tasks may not yet exist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Case'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /cases/{caseId}/impairment-analyses:
    parameters:
      - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: startImpairmentAnalysis
      summary: Onderzoeker starts a background analysis of the current ready PDF dossier
      security: [{oidcBearer: []}]
      responses:
        '202':
          description: Queued job or current pending analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DossierAnalysis'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    get:
      operationId: listImpairmentAnalyses
      summary: Onderzoeker views analysis history and staleness
      security: [{oidcBearer: []}]
      responses:
        '200':
          description: Most recent first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DossierAnalysis'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /cases/{caseId}/impairment-analyses/{analysisId}/review:
    post:
      operationId: reviewImpairmentAnalysis
      summary: Onderzoeker appends a source-linked human review, never automatic rule facts
      security: [{oidcBearer: []}]
      parameters:
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: analysisId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalysisReview'}
      responses:
        '200':
          description: Reviewed analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DossierAnalysis'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /cases/{caseId}/documents/{documentId}/structuring:
    parameters:
      - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: startDocumentStructuring
      summary: Onderzoeker starts PDF extraction; no facts or BPMN tasks are changed
      security: [{oidcBearer: []}]
      responses:
        '202':
          description: Accepted or existing processing job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentExtraction'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    get:
      operationId: getDocumentStructuring
      summary: Staff inspect extraction and source references; polling refreshes pending results
      security: [{oidcBearer: []}]
      responses:
        '200':
          description: Stored extraction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentExtraction'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /cases/{caseId}/documents/{documentId}/structuring/review:
    post:
      operationId: reviewDocumentStructuring
      summary: Onderzoeker records a reviewed transcription; never automatically supplied to RegelRecht
      security: [{oidcBearer: []}]
      parameters:
        - {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentReview'}
      responses:
        '200':
          description: Reviewed transcription with audit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentExtraction'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /cases:
    get:
      operationId: listCases
      summary: Staff dossier overview; most recent 100 fictional cases
      security: [{oidcBearer: []}]
      responses:
        '200':
          description: Cases
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Case'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createCase
      summary: Create a fictional Wlz application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case created
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /cases/address-validation:
    post:
      operationId: validateAddress
      summary: Check an address with the configured address lookup integration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressValidationRequest' }
      responses:
        '200':
          description: Address lookup result; unavailable checks do not block application submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressValidationResult' }
        '400': { $ref: '#/components/responses/Problem' }
  /cases/{caseId}:
    get:
      operationId: getCase
      summary: Retrieve a fictional Wlz application
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Case found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /persons/{personId}/cases:
    get:
      operationId: listPersonCases
      summary: List the cases linked to one person
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cases of the person, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Case' }
        '404': { $ref: '#/components/responses/Problem' }
  /cases/{caseId}/documents:
    post:
      operationId: addCaseDocument
      summary: Add a document to an existing case
      security: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: X-Document-File-Name
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255, pattern: '.*\S.*' }
        - name: X-Document-Content-Type
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[^\s/]+/[^\s/]+$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Document metadata registered
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDocument' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listCaseDocuments
      summary: List documents belonging to a case
      security:
        - oidcBearer: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CaseDocument' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /cases/{caseId}/documents/{documentId}/content:
    get:
      operationId: downloadCaseDocument
      summary: Download a document belonging to a case
      security:
        - oidcBearer: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /cases/{caseId}/tasks:
    get:
      operationId: listCaseTasks
      summary: List the tasks belonging to a case
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CaseTask' }
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /cases/{caseId}/supplement:
    post:
      operationId: provideApplicantSupplement
      summary: Submit requested fictional applicant information
      description: Public only for the fictional applicant demo. Completes only the applicant supplement task for this case.
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - name: X-Correlation-ID
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicantSupplementRequest' }
      responses:
        '200':
          description: Supplement received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseTask' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /cases/{caseId}/status:
    get:
      operationId: getCaseStatus
      summary: Retrieve the applicant-facing status projection
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest status received from application status events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseStatus' }
        '404': { $ref: '#/components/responses/Problem' }
  /cases/{caseId}/policy-evaluations:
    get:
      operationId: listCasePolicyEvaluations
      summary: List immutable policy evaluations for a case
      security:
        - oidcBearer: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Policy evaluation history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyEvaluation' }
        '404': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /cases/{caseId}/medical-assessments:
    get:
      operationId: listCaseMedicalAssessments
      summary: List immutable medical assessment evaluations for a case
      security:
        - oidcBearer: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Medical assessment history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MedicalAssessment' }
        '404': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tasks:
    get:
      operationId: listTasks
      summary: List workflow tasks for role work queues
      security:
        - oidcBearer: []
      parameters:
        - name: status
          in: query
          schema: { type: string, pattern: '^(OPEN|COMPLETED)$' }
        - name: type
          in: query
          schema: { type: string, pattern: '^(REGISTRATION_ACCEPTANCE|REQUEST_ADDITIONAL_INFORMATION|SUPPLEMENT_PROVISION|TRIAGE|WLZ_INVESTIGATION_DECISION|OUTGOING_COMMUNICATION)$' }
      responses:
        '200':
          description: Workflow tasks matching the supplied filters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CaseTask' }
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tasks/{taskId}/intake-form:
    get:
      operationId: getTaskIntakeForm
      summary: Get the active corpus-driven form for an intake or additional-information task
      security:
        - oidcBearer: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Versioned intake form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeForm' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tasks/{taskId}/medical-assessment-form:
    get:
      operationId: getTaskMedicalAssessmentForm
      summary: Get the active RegelRecht-driven form for an application review task
      security:
        - oidcBearer: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Versioned medical assessment form
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntakeForm' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: Complete an open task
      security:
        - oidcBearer: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Correlation-ID
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCompletionRequest' }
      responses:
        '200':
          description: Completed task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseTask' }
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    DossierAnalysis:
      type: object
      required: [analysisId, caseId, createdAt, status, stale, documentIds, reviews]
      properties:
        analysisId: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [QUEUED, PROCESSING, READY, FAILED]}
        stale: {type: boolean}
        errorCode: {type: string, nullable: true, enum: [UNAVAILABLE, INTERRUPTED]}
        documentIds: {type: array, items: {type: string, format: uuid}}
        output: {$ref: './impairment-analysis.yaml#/components/schemas/AnalysisOutput'}
        reviews:
          type: array
          items: {$ref: '#/components/schemas/AnalysisReviewRecord'}
    AnalysisReview:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ReviewedFinding'}
        clientPicture: {type: string, maxLength: 20000, nullable: true}
    ReviewedFinding:
      type: object
      required: [findingId, domain, explanation, disposition, sources]
      properties:
        findingId: {type: string, minLength: 1, maxLength: 100}
        domain: {type: string, minLength: 1, maxLength: 200}
        score: {type: integer, nullable: true, minimum: 0, maximum: 4}
        explanation: {type: string, minLength: 1, maxLength: 20000}
        disposition: {type: string, enum: [CONFIRMED, ADJUSTED, REJECTED, MANUAL]}
        sources:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: './impairment-analysis.yaml#/components/schemas/Source'}
    AnalysisReviewRecord:
      type: object
      required: [reviewId, reviewedBy, reviewedAt, review]
      properties:
        reviewId: {type: string, format: uuid}
        reviewedBy: {type: string}
        reviewedAt: {type: string, format: date-time}
        review: {$ref: '#/components/schemas/AnalysisReview'}
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [applicantId, clientName, lastName, initials, citizenServiceNumber, birthDate, street, houseNumber, postalCode, city, country, permanentCareNeed, permanentSupervision, applicantRole, signedBy]
      properties:
        applicantId: { type: string, minLength: 1, maxLength: 100, pattern: '.*\S.*' }
        submissionChannel:
          type: string
          enum: [CLIENT_PORTAL, CARE_PROVIDER, POST]
          default: CLIENT_PORTAL
          description: Intake channel, separate from applicant identity and authorization. POST is registered by the researcher; AO only uploads documents.
        clientName: { type: string, minLength: 1, maxLength: 200, pattern: '.*\S.*' }
        lastName: { type: string, minLength: 1, maxLength: 100, pattern: '.*\S.*' }
        initials: { type: string, minLength: 1, maxLength: 20, pattern: '.*\S.*' }
        citizenServiceNumber: { type: string, pattern: '^\d{9}$' }
        birthDate:
          type: string
          format: date
          x-field-extra-annotation: '@jakarta.validation.constraints.PastOrPresent'
        street: { type: string, minLength: 1, maxLength: 120, pattern: '.*\S.*' }
        houseNumber: { type: string, minLength: 1, maxLength: 20, pattern: '.*\S.*' }
        postalCode: { type: string, minLength: 1, maxLength: 12, pattern: '.*\S.*' }
        city: { type: string, minLength: 1, maxLength: 120, pattern: '.*\S.*' }
        country: { type: string, minLength: 1, maxLength: 80, pattern: '.*\S.*' }
        permanentCareNeed: { type: boolean }
        permanentSupervision: { type: boolean }
        applicantRole:
          type: string
          enum: [client, gemachtigde, wettelijk_vertegenwoordiger]
          description: De hoedanigheid van degene die de aanvraag indient.
        signedBy:
          type: string
          enum: [client, gemachtigde, gevolmachtigde_of_wettelijk_vertegenwoordiger, niemand, anders]
          description: Wie de aanvraag heeft ondertekend; sluit aan op de RegelRecht-invoer.
        authorizationSignedByClient:
          type: boolean
          nullable: true
          description: Verklaring van de aanvrager; het CIZ controleert het machtigingsformulier afzonderlijk.
    Case:
      type: object
      additionalProperties: false
      required: [caseId, personId, addressId, applicationId, createdAt, person, address, application, decisions]
      properties:
        caseId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        person: { $ref: '#/components/schemas/Person' }
        address: { $ref: '#/components/schemas/Address' }
        application: { $ref: '#/components/schemas/Application' }
        decisions:
          type: array
          description: Besluiten in chronologische volgorde; een zaak kan meerdere besluiten bevatten.
          items: { $ref: '#/components/schemas/Decision' }
    Decision:
      type: object
      additionalProperties: false
      required: [decisionId, caseId, result, motivation, grondslagen, decidedAt]
      properties:
        decisionId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        result: { type: string, enum: [GRANTED, DECLINED, NOT_TAKEN_INTO_CONSIDERATION] }
        motivation: { type: string }
        zorgprofiel: { type: string, nullable: true, maxLength: 100 }
        grondslagen:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        decidedAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        sourceTaskId: { type: string, format: uuid, nullable: true }
        policyEvaluationId: { type: string, format: uuid, nullable: true }
        medicalAssessmentId: { type: string, format: uuid, nullable: true }
    Person:
      type: object
      additionalProperties: false
      required: [personId, clientName, lastName, initials, citizenServiceNumber, birthDate]
      properties:
        personId: { type: string, format: uuid }
        clientName: { type: string }
        lastName: { type: string }
        initials: { type: string }
        citizenServiceNumber: { type: string }
        birthDate: { type: string, format: date }
    Address:
      type: object
      additionalProperties: false
      required: [addressId, personId, street, houseNumber, postalCode, city, country]
      properties:
        addressId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        street: { type: string }
        houseNumber: { type: string }
        postalCode: { type: string }
        city: { type: string }
        country: { type: string }
    Application:
      type: object
      additionalProperties: false
      required: [applicationId, caseId, applicantId, permanentCareNeed, permanentSupervision, applicantRole, submissionChannel, signedBy, submittedAt, applicantStatus, statusUpdatedAt]
      properties:
        applicationId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        applicantId: { type: string }
        permanentCareNeed: { type: boolean }
        permanentSupervision: { type: boolean }
        applicantRole: { type: string, enum: [client, gemachtigde, wettelijk_vertegenwoordiger] }
        submissionChannel: {type: string, enum: [CLIENT_PORTAL, CARE_PROVIDER, POST]}
        signedBy: { type: string, enum: [client, gemachtigde, gevolmachtigde_of_wettelijk_vertegenwoordiger, niemand, anders] }
        authorizationSignedByClient: { type: boolean, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        supplementRequest: { type: string, nullable: true }
        supplementResponse: { type: string, nullable: true }
        supplementRequestedAt: { type: string, format: date-time, nullable: true }
        supplementRespondedAt: { type: string, format: date-time, nullable: true }
        applicantStatus:
          type: string
          enum: [DRAFT, WAITING_FOR_REGISTRATION, WAITING_FOR_DOCUMENTS, WAITING_FOR_TRIAGE, WAITING_FOR_ASSESSMENT, DECISION_PENDING, DECISION_SENT]
        statusUpdatedAt: { type: string, format: date-time }

    CaseStatus:
      type: object
      additionalProperties: false
      required: [caseId, status, updatedAt]
      properties:
        caseId: { type: string, format: uuid }
        status:
          type: string
          enum: [DRAFT, WAITING_FOR_REGISTRATION, WAITING_FOR_DOCUMENTS, WAITING_FOR_TRIAGE, WAITING_FOR_ASSESSMENT, DECISION_PENDING, DECISION_SENT]
        updatedAt: { type: string, format: date-time }

    AddressValidationRequest:
      type: object
      additionalProperties: false
      required: [country, postalCode, houseNumber]
      properties:
        country: { type: string, minLength: 1, maxLength: 80 }
        postalCode: { type: string, minLength: 1, maxLength: 12 }
        houseNumber: { type: string, minLength: 1, maxLength: 20 }

    AddressValidationResult:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status:
          type: string
          enum: [MATCHED, NO_MATCH, UNAVAILABLE, NOT_SUPPORTED, INVALID_INPUT]
        message: { type: string }
        suggestedStreet: { type: string, nullable: true }
        suggestedCity: { type: string, nullable: true }
        suggestedPostalCode: { type: string, nullable: true }
        suggestedHouseNumber: { type: string, nullable: true }
    CaseDocument:
      type: object
      additionalProperties: false
      required: [documentId, caseId, fileName, contentType, size, sha256, createdAt]
      properties:
        documentId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { type: string, format: date-time }
    CaseTask:
      type: object
      additionalProperties: false
      required: [taskId, caseId, type, status, createdAt]
      properties:
        taskId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        type:
          type: string
          enum: [REGISTRATION_ACCEPTANCE, REQUEST_ADDITIONAL_INFORMATION, SUPPLEMENT_PROVISION, TRIAGE, WLZ_INVESTIGATION_DECISION, OUTGOING_COMMUNICATION]
        status:
          type: string
          enum: [OPEN, COMPLETED]
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    TaskCompletionRequest:
      type: object
      additionalProperties: false
      properties:
        facts:
          type: object
          additionalProperties: true
        effectiveDate: { type: string, format: date, nullable: true }
        registrationOutcome: { type: string, enum: [ACCEPTED, REQUEST_ADDITIONAL_INFORMATION, NOT_TAKEN_INTO_CONSIDERATION] }
        triageOutcome: { type: string, enum: [FURTHER_INVESTIGATION, DIRECT_HANDLED, NOT_TAKEN_INTO_CONSIDERATION] }
        decisionResult: { type: string, enum: [GRANTED, DECLINED, NOT_TAKEN_INTO_CONSIDERATION] }
        decisionMotivation: { type: string, maxLength: 4000 }
        zorgprofiel: { type: string, maxLength: 100 }
        grondslagen:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        supplementText: { type: string, maxLength: 4000 }
    ApplicantSupplementRequest:
      type: object
      additionalProperties: false
      required: [supplementText]
      properties:
        supplementText: { type: string, minLength: 1, maxLength: 4000 }
    IntakeForm:
      type: object
      additionalProperties: false
      required: [formId, policyVersion, fields]
      properties:
        formId: { type: string }
        policyVersion: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/IntakeField' }
    IntakeField:
      type: object
      additionalProperties: false
      required: [factId, type, required, label]
      properties:
        factId: { type: string }
        type: { type: string, enum: [boolean, string, number, date] }
        required: { type: boolean }
        label: { type: string }
        description: { type: string, nullable: true }
        groupId: { type: string }
        groupTitle: { type: string }
        groupDescription: { type: string }
        groupOrder: { type: integer }
    PolicyEvaluation:
      type: object
      additionalProperties: false
      required: [evaluationId, caseId, taskId, facts, canBeTakenIntoConsideration, outputs, resolvedInputs, policyVersion, engineVersion, schemaVersion, regulationHash, effectiveDate, evaluatedAt]
      properties:
        evaluationId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        facts: { type: object, additionalProperties: true }
        canBeTakenIntoConsideration: { type: boolean }
        outputs: { type: object, additionalProperties: true }
        resolvedInputs: { type: object, additionalProperties: true }
        policyVersion: { type: string }
        engineVersion: { type: string }
        schemaVersion: { type: string }
        regulationHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        effectiveDate: { type: string, format: date }
        evaluatedAt: { type: string, format: date-time }
    MedicalAssessment:
      type: object
      additionalProperties: false
      required: [assessmentId, caseId, taskId, facts, assessmentComplete, criteriaMet, medicalAdviceRequired, outputs, policyVersion, engineVersion, schemaVersion, regulationHash, effectiveDate, assessedAt]
      properties:
        assessmentId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        facts: { type: object, additionalProperties: true }
        assessmentComplete: { type: boolean }
        criteriaMet: { type: boolean }
        medicalAdviceRequired: { type: boolean }
        outputs: { type: object, additionalProperties: true }
        resolvedInputs: { type: object, additionalProperties: true }
        policyVersion: { type: string }
        engineVersion: { type: string }
        schemaVersion: { type: string }
        regulationHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        effectiveDate: { type: string, format: date }
        assessedAt: { type: string, format: date-time }
    DocumentReview:
      type: object
      additionalProperties: false
      required: [text, confirmed]
      properties:
        text: {type: string, minLength: 1, maxLength: 20000}
        confirmed: {type: boolean, enum: [true]}
    DocumentExtraction:
      type: object
      required: [extractionId, caseId, documentId, createdAt, status, mock, fragments]
      properties:
        extractionId: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        status: {type: string, enum: [PROCESSING, READY, FAILED, REVIEWED]}
        jobId: {type: string, nullable: true}
        runId: {type: string, nullable: true}
        providerVersion: {type: string, nullable: true}
        modelId: {type: string, nullable: true}
        mock: {type: boolean}
        hasSourceArtifact: {type: boolean, description: Original OCR units are available in S3 for dossier analysis.}
        fragments:
          type: array
          items: {$ref: './document-structuring.yaml#/components/schemas/ExtractedFragment'}
        reviewedText: {type: string, nullable: true}
        reviewedBy: {type: string, nullable: true}
        reviewedAt: {type: string, format: date-time, nullable: true}
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
