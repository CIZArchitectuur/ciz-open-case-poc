quarkus.http.host=0.0.0.0
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:assessment}
quarkus.datasource.password=${DB_PASSWORD:assessment-local-only}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:assessment-db}:5432/${DB_NAME:assessment}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.otel.service.name=assessment-service
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
