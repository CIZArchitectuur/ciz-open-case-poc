name: Azure storage readiness fix
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-deploy-dev
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      FRONTEND_URL: https://ciz-dev-frontend.blacktree-22b1bed9.westeurope.azurecontainerapps.io
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: 53140781-c4dd-40a2-8a89-92127023d5fe
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Keep the storage gateway available for startup bucket checks
        run: az containerapp update -g ciz-open-case-poc-dev -n ciz-dev-s3 --min-replicas 1 --output none
      - name: Verify deployed stack
        run: |
          docker build -f tests/Dockerfile -t ciz-azure-smoke .
          docker run --rm ciz-azure-smoke pytest -q tests/contract/test_smoke_diagnostics.py
          docker run --rm -e FRONTEND_URL -e DEMO_USER_PASSWORD ciz-azure-smoke python tests/deployment/smoke.py
