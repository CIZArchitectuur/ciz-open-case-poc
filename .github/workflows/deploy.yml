name: Azure deploy

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: Globally unique Azure resource suffix (keep unchanged for redeploys)
        type: string
        default: cizdev42
        required: true

concurrency:
  group: azure-deploy-dev
  cancel-in-progress: false
permissions:
  contents: read

env:
  AZURE_TENANT_ID: 53140781-c4dd-40a2-8a89-92127023d5fe
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ciz-open-case-poc-dev
  AZURE_SUFFIX: ${{ inputs.suffix }}
  AZURE_ENVIRONMENT: dev
  IMAGE_TAG: ${{ github.sha }}

jobs:
  preflight:
    name: Check Azure federation and deployment scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the target subscription
        run: |
          if [[ ! "$AZURE_SUBSCRIPTION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Set the AZURE_SUBSCRIPTION_ID repository variable to the target subscription ID."
            exit 1
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Check existing resource group and providers
        run: |
          set -euo pipefail
          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          for provider in Microsoft.App Microsoft.Network Microsoft.DBforPostgreSQL Microsoft.Storage Microsoft.ContainerRegistry Microsoft.OperationalInsights Microsoft.EventHub; do
            if ! state=$(az provider show --namespace "$provider" --query registrationState -o tsv 2>/dev/null); then
              echo "::warning::Cannot read subscription registration for $provider with resource-group-scoped rights; deployment will verify availability."
              continue
            fi
            [ "$state" = Registered ] || { echo "::error::$provider must be registered by a subscription administrator"; exit 1; }
          done

  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy and verify Azure
    needs: [verify, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      S3_PROXY_PASSWORD: ${{ secrets.S3_PROXY_PASSWORD }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      OCR_REMOTE_BASE_URL: ${{ vars.OCR_REMOTE_BASE_URL }}
      PIPELINE_GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: python3 scripts/azure-parameters.py validate
      - name: Log in as the deployment service principal (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy VNet, Consumption environment and persistent infrastructure
        run: |
          set -euo pipefail
          python3 scripts/azure-parameters.py bootstrap
          az deployment group create --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "bootstrap-$GITHUB_RUN_ID" --template-file infra/bootstrap.bicep \
            --parameters @"$RUNNER_TEMP/bootstrap.parameters.json" --output none
          domain=$(az deployment group show -g "$AZURE_RESOURCE_GROUP" -n "bootstrap-$GITHUB_RUN_ID" --query properties.outputs.defaultDomain.value -o tsv)
          echo "DEFAULT_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "ACR_NAME=cizopencase$AZURE_SUFFIX" >> "$GITHUB_ENV"
      - name: Configure repository-scoped registry credentials
        run: |
          set -euo pipefail
          push_password=$(az acr token credential generate -r "$ACR_NAME" -n github-actions-push --password1 --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$push_password"
          printf '%s' "$push_password" | docker login "$ACR_NAME.azurecr.io" --username github-actions-push --password-stdin
          pull_password=$(az acr token credential generate -r "$ACR_NAME" -n container-apps-pull --password1 --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$pull_password"
          echo "REGISTRY_PASSWORD=$pull_password" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push all application images
        run: bash scripts/azure-build-images.sh
      - name: Deploy applications
        run: |
          set -euo pipefail
          python3 scripts/azure-parameters.py apps
          az deployment group create --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "apps-$GITHUB_RUN_ID" --template-file infra/apps.bicep \
            --parameters @"$RUNNER_TEMP/apps.parameters.json" --output none
          echo "FRONTEND_URL=https://ciz-dev-frontend.$DEFAULT_DOMAIN" >> "$GITHUB_ENV"
      - name: Check single NAT egress and public ingress
        run: bash scripts/azure-verify-infrastructure.sh
      - name: Verify deployed API, authentication, documents and asynchronous workflow
        run: |
          docker build -f tests/Dockerfile -t ciz-azure-smoke .
          docker run --rm -e FRONTEND_URL -e DEMO_USER_PASSWORD ciz-azure-smoke python tests/deployment/smoke.py
      - name: Deployment summary
        run: |
          printf 'Frontend: %s\n\nConsumption workload profile, private PostgreSQL, one public application ingress and one NAT egress.\n\nOCR uses the CIZ BAS service. Impairment analysis uses a labelled mock. Use only fictional or approved non-identifiable test documents.\n' "$FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/bootstrap.parameters.json" "$RUNNER_TEMP/apps.parameters.json"
          docker logout "cizopencase$AZURE_SUFFIX.azurecr.io" || true
