name: Azure proxy deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ciz-open-case-poc-dev
      APP: ciz-dev-frontend
      REGISTRY: cizopencasecizdev42
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: 53140781-c4dd-40a2-8a89-92127023d5fe
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and validate proxy configuration over deployed frontend
        run: |
          set -euo pipefail
          current=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --query properties.template.containers[0].image -o tsv)
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "FRONTEND_URL=https://$fqdn" >> "$GITHUB_ENV"
          password=$(az acr token credential generate -r "$REGISTRY" -n github-actions-push --password1 --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$password"
          printf '%s' "$password" | docker login "$REGISTRY.azurecr.io" --username github-actions-push --password-stdin
          target="$REGISTRY.azurecr.io/frontend-azure:proxy-$GITHUB_SHA"
          docker build -f infra/frontend/Dockerfile --build-arg "FRONTEND_IMAGE=$current" -t "$target" .
          docker run --rm -e IDENTITY_URL=http://localhost -e GATEWAY_URL=http://localhost "$target" nginx -t
          docker push "$target"
          echo "PROXY_IMAGE=$target" >> "$GITHUB_ENV"
      - name: Update frontend proxy only
        run: az containerapp update -g "$RESOURCE_GROUP" -n "$APP" --image "$PROXY_IMAGE" --output none
      - name: Configure backend cold-start timeouts
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n ciz-dev-case --set-env-vars QUARKUS_REST_CLIENT_ASSESSMENT_API_READ_TIMEOUT=45000 DOCUMENT_READ_TIMEOUT_MS=45000 OPERATON_READ_TIMEOUT_MS=30000 --output none
      - name: Verify deployed stack
        run: |
          docker build -f tests/Dockerfile -t ciz-azure-smoke .
          docker run --rm ciz-azure-smoke pytest -q tests/contract/test_smoke_diagnostics.py
          docker run --rm -e FRONTEND_URL -e DEMO_USER_PASSWORD ciz-azure-smoke python tests/deployment/smoke.py
      - name: Remove registry login
        if: always()
        run: docker logout "$REGISTRY.azurecr.io" || true
