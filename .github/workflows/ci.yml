name: Containerized build and tests

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment contracts in Docker
        run: docker compose --profile test run --build --rm deployment-tests
      - name: Build Bicep deployments
        run: |
          az bicep build --file infra/bootstrap.bicep
          az bicep build --file infra/apps.bicep

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: compose.yaml:compose.analysis-test.yaml:compose.azure-blob.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime and test images
        run: |
          sh scripts/generate-frontend-models.sh
          git diff --exit-code -- frontend/src/generated/case-api.d.ts
          docker compose --profile test build workflow-start-adapter s3 case-service bas-service assessment-service document-service policy-service address-validation-adapter document-structuring-adapter impairment-analysis-adapter pipeline-mock status-notification-adapter operaton frontend unit-tests document-unit-tests address-validation-tests document-structuring-tests impairment-analysis-tests status-notification-tests contract-tests integration-tests e2e-tests ui-tests
      - name: Start the vertical slice
        run: docker compose up -d --wait
      - name: Unit tests
        run: docker compose --profile test run --rm unit-tests
      - name: Document-service unit tests
        run: docker compose --profile test run --rm document-unit-tests
      - name: Address-validation adapter tests
        run: docker compose --profile test run --rm address-validation-tests
      - name: Status-notification adapter tests
        run: docker compose --profile test run --rm status-notification-tests
      - name: Document-structuring adapter tests
        run: docker compose --profile test run --rm document-structuring-tests
      - name: Impairment-analysis adapter tests
        run: docker compose --profile test run --rm impairment-analysis-tests
      - name: Contract tests
        run: docker compose --profile test run --rm contract-tests
      - name: Integration tests
        run: docker compose --profile test run --rm integration-tests
      - name: Document persistence across stateless S3 gateway restart
        run: sh scripts/test-blob-persistence.sh
      - name: Kafka workflow outage, recovery and replay
        run: sh scripts/test-workflow-async.sh
      - name: End-to-end tests
        run: docker compose --profile test run --rm e2e-tests
      - name: Browser UI tests
        run: docker compose --profile test run --rm ui-tests
      - name: Preserve generated contract for diagnosing stale models
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-frontend-contract
          path: frontend/src/generated/case-api.d.ts
          retention-days: 1
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans
