quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:cases}
quarkus.datasource.password=${DB_PASSWORD:cases-local-only}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:case-db}:${DB_PORT:5432}/${DB_NAME:cases}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.otel.service.name=case-service
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.jackson.fail-on-unknown-properties=true
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8082/realms/ciz-poc}
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:http://localhost:8082/realms/ciz-poc}
quarkus.oidc.token.audience=${OIDC_TOKEN_AUDIENCE:ciz-api}
quarkus.oidc.roles.role-claim-path=${OIDC_ROLE_CLAIM_PATH:ciz_roles}
quarkus.oidc.connection-delay=20S
# Generated clients each register their own response mapper. Disable global provider
# discovery so an Operaton mapper cannot accidentally handle a document response.
quarkus.rest-client.provider-autodiscovery=false
quarkus.rest-client.operaton-api.url=${API_GATEWAY_URL:http://localhost:8000}/api/workflow
quarkus.rest-client.operaton-api.connect-timeout=${OPERATON_CONNECT_TIMEOUT_MS:3000}
quarkus.rest-client.operaton-api.read-timeout=${OPERATON_READ_TIMEOUT_MS:10000}
quarkus.rest-client.document-api.url=${API_GATEWAY_URL:http://localhost:8000}/api
quarkus.rest-client.document-api.connect-timeout=${DOCUMENT_CONNECT_TIMEOUT_MS:3000}
quarkus.rest-client.document-api.read-timeout=${DOCUMENT_READ_TIMEOUT_MS:15000}
quarkus.rest-client.policy-api.url=${API_GATEWAY_URL:http://localhost:8000}/api/rules
quarkus.rest-client.policy-api.connect-timeout=${POLICY_CONNECT_TIMEOUT_MS:3000}
quarkus.rest-client.policy-api.read-timeout=${POLICY_READ_TIMEOUT_MS:10000}
quarkus.rest-client.address-validation-api.url=${API_GATEWAY_URL:http://localhost:8000}/internal/address-validation
quarkus.rest-client.address-validation-api.connect-timeout=${ADDRESS_VALIDATION_CONNECT_TIMEOUT_MS:1500}
quarkus.rest-client.address-validation-api.read-timeout=${ADDRESS_VALIDATION_READ_TIMEOUT_MS:2500}
org.eclipse.microprofile.rest.client.propagateHeaders=traceparent,tracestate,X-Correlation-ID

# Application status events: transactional outbox -> Kafka -> applicant status projection.
mp.messaging.outgoing.application-status-events-out.connector=smallrye-kafka
mp.messaging.outgoing.application-status-events-out.topic=application.status.changed
mp.messaging.outgoing.application-status-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.application-status-events-out.acks=all
mp.messaging.outgoing.application-status-events-out.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
mp.messaging.incoming.application-status-events-in.connector=smallrye-kafka
mp.messaging.incoming.application-status-events-in.topic=application.status.changed
mp.messaging.incoming.application-status-events-in.group.id=case-service-status-projection
mp.messaging.incoming.application-status-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.application-status-events-in.auto.offset.reset=earliest
mp.messaging.incoming.application-status-events-in.failure-strategy=dead-letter-queue
mp.messaging.incoming.application-status-events-in.dead-letter-queue.topic=application.status.changed.dlq
mp.messaging.incoming.application-status-events-in.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
